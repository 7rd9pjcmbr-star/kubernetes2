services:
  proxy:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: proxy
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
    ports:
      - "8080:8080"
      - "8888:8888"
      - "1080:1080"
      - "9090:9090"
    depends_on:
      - mongo

  tondaithanh-bot:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
      target: bot
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
