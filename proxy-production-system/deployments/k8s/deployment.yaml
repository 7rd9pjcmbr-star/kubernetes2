apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-system
  labels:
    app: proxy-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: proxy-system
  template:
    metadata:
      labels:
        app: proxy-system
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: proxy
          image: ghcr.io/example/proxy-production-system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: proxy-system-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
