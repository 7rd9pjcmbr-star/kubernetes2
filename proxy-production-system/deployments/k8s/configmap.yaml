apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-system-config
data:
  PROXY_LISTEN_ADDRESS: ":8080"
  PROXY_UPSTREAMS: "http://upstream-api.default.svc.cluster.local:8080"
  PROXY_READ_TIMEOUT: "15s"
  PROXY_WRITE_TIMEOUT: "15s"
  PROXY_IDLE_TIMEOUT: "60s"
  PROXY_SHUTDOWN_TIMEOUT: "20s"
  PROXY_REQUEST_TIMEOUT: "30s"
  PROXY_RATE_LIMIT_RPS: "200"
  PROXY_RATE_LIMIT_BURST: "400"
  PROXY_TRUST_FORWARDED: "true"
  PROXY_LOG_FORMAT: "json"
  PROXY_SERVICE_NAME: "proxy-production-system"
  PROXY_TRACE_OTLP_ENDPOINT: "otel-collector.observability.svc.cluster.local:4317"
  PROXY_TRACE_OTLP_INSECURE: "true"
  PROXY_TRACE_SAMPLE_RATIO: "1.0"
